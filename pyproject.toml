[project]
name = "swwie"
version = "0.1.0"
description = "a wallpaper fetcher tool for wayland"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["slint"]

[project.scripts]
swwie = "swwie.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["swwie*"]
