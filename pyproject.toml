[project]
name = "swwie"
version = "0.1.0"
description = "a wallpaper fetcher tool for wayland"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["requests>=2.34.2", "slint"]

[project.scripts]
swwie = "UI.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["UI*", "fetchers*"]

[tool.setuptools.package-data]
UI = ["*.slint"]
